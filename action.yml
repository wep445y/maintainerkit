name: MaintainerKit Activity Digest
description: Create a read-only activity digest and draft release notes from recent repository work.
author: wep445y
branding:
  icon: list
  color: blue
inputs:
  github-token:
    description: Token with read access to issues and pull requests.
    required: true
    default: ${{ github.token }}
  repository:
    description: owner/repository to inspect. Defaults to the current workflow repository.
    required: false
    default: ${{ github.repository }}
  days:
    description: Look-back window in days (1–365).
    required: false
    default: "7"
  max-items:
    description: Maximum activity entries shown in the digest (1–200).
    required: false
    default: "50"
  title:
    description: Heading used for the activity digest.
    required: false
    default: MaintainerKit weekly digest
outputs:
  digest-markdown:
    description: Markdown activity digest written to the workflow summary.
  release-notes-markdown:
    description: Draft release notes based on pull requests merged during the look-back window.
runs:
  using: node24
  main: dist/index.mjs
